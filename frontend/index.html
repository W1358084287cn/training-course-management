<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消课管理系统</title>
    <script src="/vendor/tailwind.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#3b82f6",
              secondary: "#10b981",
              accent: "#f59e0b",
              danger: "#ef4444",
              dark: "#1e293b",
              light: "#f8fafc"
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"]
            }
          }
        }
      };
    </script>
    <link href="/vendor/font-awesome.min.css" rel="stylesheet" />
    <script src="/vendor/xlsx.full.min.js"></script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          font:
            14px / 1.5 Helvetica Neue,
            Helvetica,
            Arial,
            Microsoft Yahei,
            Hiragino Sans GB,
            Heiti SC,
            WenQuanYi Micro Hei,
            sans-serif;
        }
      }
      @layer utilities {
        .transition-all {
          transition: all 0.3s ease;
        }
        .card {
          @apply bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg;
        }
        .btn {
          @apply px-6 py-3 rounded-md transition-all duration-300 font-medium text-base;
        }
        .btn-primary {
          @apply bg-primary text-white hover:bg-blue-600;
        }
        .btn-secondary {
          @apply bg-secondary text-white hover:bg-green-600;
        }
        .btn-accent {
          @apply bg-accent text-white hover:bg-amber-600;
        }
        .btn-gray {
          @apply bg-gray-700 text-white hover:bg-gray-800;
        }
        .btn-outline {
          @apply border border-gray-300 text-gray-700 hover:bg-gray-100;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
