<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消课管理系统</title>
    <script src="/vendor/tailwind.js"></script>
    <link href="/vendor/font-awesome.min.css" rel="stylesheet" />
    <script src="/vendor/xlsx.full.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#3b82f6",
              secondary: "#10b981",
              accent: "#f59e0b",
              danger: "#ef4444",
              dark: "#1e293b",
              light: "#f8fafc",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          font:
            14px / 1.5 Helvetica Neue,
            Helvetica,
            Arial,
            Microsoft Yahei,
            Hiragino Sans GB,
            Heiti SC,
            WenQuanYi Micro Hei,
            sans-serif;
        }
      }
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }
        .transition-all {
          transition: all 0.3s ease;
        }
        .shadow-hover {
          @apply transition-all duration-300 hover:shadow-lg;
        }
        .animate-fade-in {
          animation: fadeIn 0.5s ease-in-out;
        }
        .animate-slide-in {
          animation: slideIn 0.3s ease-out;
        }
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(-10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        @keyframes slideIn {
          from {
            opacity: 0;
            transform: translateX(-20px);
          }
          to {
            opacity: 1;
            transform: translateX(0);
          }
        }
        .card {
          @apply bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg;
        }
        .btn {
          @apply px-6 py-3 rounded-md transition-all duration-300 font-medium text-base;
        }
        .btn-primary {
          @apply bg-primary text-white hover:bg-blue-600;
        }
        .btn-secondary {
          @apply bg-secondary text-white hover:bg-green-600;
        }
        .btn-accent {
          @apply bg-accent text-white hover:bg-amber-600;
        }
        .btn-gray {
          @apply bg-gray-700 text-white hover:bg-gray-800;
        }
        .btn-outline {
          @apply border border-gray-300 text-gray-700 hover:bg-gray-100;
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
      <div
        class="container mx-auto px-4 py-3 flex justify-between items-center"
      >
        <div class="flex items-center space-x-2">
          <!-- logo图片 -->
          <img src="/emage/logo.jpg" alt="logo" class="h-10 w-10" />
          <h1 class="text-xl font-bold text-gray-800">消课管理系统</h1>
        </div>
        <div class="flex space-x-4">
          <button id="nav-members" class="btn btn-primary">会员管理</button>
          <button id="nav-schedule" class="btn btn-outline">排课管理</button>
        </div>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6">
      <!-- 会员管理页面 -->
      <div id="members-page" class="block">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-gray-800">会员列表</h2>
          <div class="flex space-x-3">
            <button
              id="activity-management-btn"
              class="btn btn-accent flex items-center"
            >
              <i class="fa fa-cog mr-2"></i>活动管理
            </button>
            <button
              id="add-member-btn"
              class="btn btn-secondary flex items-center"
            >
              <i class="fa fa-plus mr-2"></i>添加会员
            </button>
            <button
              id="export-members"
              class="btn btn-accent flex items-center"
            >
              <i class="fa fa-download mr-2"></i>导出Excel
            </button>
            <button id="import-members" class="btn btn-gray flex items-center">
              <i class="fa fa-upload mr-2"></i>导入Excel
            </button>
            <button
              id="refresh-data-btn"
              class="btn btn-primary flex items-center"
            >
              <i class="fa fa-refresh mr-2"></i>刷新数据
            </button>
            <input
              type="file"
              id="file-input"
              accept=".xlsx, .xls"
              class="hidden"
            />
          </div>
        </div>

        <!-- 到期提醒组件 -->
        <div id="expiry-alerts" class="mb-6 card animate-fade-in">
          <div
            class="p-4 flex justify-between items-center cursor-pointer"
            onclick="toggleExpiryAlerts()"
          >
            <h3 class="text-lg font-semibold text-gray-800 flex items-center">
              <i class="fa fa-bell text-accent mr-2"></i>到期提醒
            </h3>
            <i
              id="alert-toggle-icon"
              class="fa fa-chevron-down text-gray-500"
            ></i>
          </div>
          <div
            id="alert-content"
            class="space-y-2 p-0 p-4 border-t border-gray-200"
          >
            <!-- 提醒内容将通过JavaScript动态添加 -->
          </div>
        </div>

        <!-- 查找功能 -->
        <div class="mb-6">
          <div class="relative flex items-center w-full">
            <input
              type="text"
              id="search-input"
              placeholder="根据姓名查找会员"
              class="w-full px-5 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-base"
            />
            <button
              id="search-btn"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-primary text-lg"
            >
              <i class="fa fa-search"></i>
            </button>
            <button
              id="exit-search-btn"
              class="ml-3 btn btn-outline flex items-center hidden"
              aria-label="退出搜索状态，清空所有查询条件"
              title="退出搜索"
            >
              <i class="fa fa-times mr-1"></i>退出搜索
            </button>
          </div>
        </div>

        <!-- 会员表格 -->
        <div class="card">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    姓名
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    卡型
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    年龄
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    开卡时间
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    到期日期
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    课时
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    剩余课时
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    备注
                  </th>
                  <th
                    class="px-6 py-4 text-left text-base font-medium text-gray-700"
                  >
                    操作
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200" id="members-table-body">
                <!-- 会员数据将通过JavaScript动态添加 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 排课管理页面 -->
      <div id="schedule-page" class="hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-gray-800">排课表</h2>
          <div class="flex space-x-3">
            <button
              id="add-schedule-btn"
              class="btn btn-secondary flex items-center"
            >
              <i class="fa fa-plus mr-2"></i>添加排课
            </button>
            <button
              id="add-uncertain-btn"
              class="btn btn-secondary flex items-center"
            >
              <i class="fa fa-plus mr-2"></i>添加不确定情况
            </button>
            <button
              id="add-irregular-btn"
              class="btn btn-secondary flex items-center"
            >
              <i class="fa fa-plus mr-2"></i>添加不定时上课
            </button>
            <button
              id="export-schedule"
              class="btn btn-accent flex items-center"
            >
              <i class="fa fa-download mr-2"></i>导出Excel
            </button>
            <button id="import-schedule" class="btn btn-gray flex items-center">
              <i class="fa fa-upload mr-2"></i>导入Excel
            </button>
            <input
              type="file"
              id="schedule-file-input"
              accept=".xlsx, .xls"
              class="hidden"
            />
          </div>
        </div>

        <!-- 排课表格查找功能 -->
        <div class="mb-6">
          <div class="relative flex items-center w-full">
            <input
              type="text"
              id="schedule-search-input"
              placeholder="查找排课"
              class="w-full px-5 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-base"
            />
            <button
              id="schedule-search-btn"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-primary text-lg"
            >
              <i class="fa fa-search"></i>
            </button>
            <button
              id="schedule-exit-search-btn"
              class="ml-3 btn btn-outline flex items-center hidden"
              aria-label="退出搜索状态，清空所有查询条件"
              title="退出搜索"
            >
              <i class="fa fa-times mr-1"></i>退出搜索
            </button>
          </div>
        </div>

        <!-- 排课表格 -->
        <div class="card mb-6">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    时间
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期一
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期二
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期三
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期四
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期五
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期六
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    星期日
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    操作
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200" id="schedule-table-body">
                <!-- 排课数据将通过JavaScript动态添加 -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- 不确定情况列表查找功能 -->
        <div class="mb-6">
          <div class="relative flex items-center w-full">
            <input
              type="text"
              id="uncertain-search-input"
              placeholder="查找不确定情况"
              class="w-full px-5 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-base"
            />
            <button
              id="uncertain-search-btn"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-primary text-lg"
            >
              <i class="fa fa-search"></i>
            </button>
            <button
              id="uncertain-exit-search-btn"
              class="ml-3 btn btn-outline flex items-center hidden"
              aria-label="退出搜索状态，清空所有查询条件"
              title="退出搜索"
            >
              <i class="fa fa-times mr-1"></i>退出搜索
            </button>
          </div>
        </div>

        <!-- 不确定情况列表 -->
        <div class="card mb-6">
          <div class="p-4 border-b border-gray-200">
            <h3 class="text-lg font-semibold text-gray-800">不确定情况列表</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    日期
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    时间
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    姓名
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    课程
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    备注
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    操作
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200" id="uncertain-table-body">
                <!-- 不确定情况数据将通过JavaScript动态添加 -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- 不定时上课列表查找功能 -->
        <div class="mb-6">
          <div class="relative flex items-center w-full">
            <input
              type="text"
              id="irregular-search-input"
              placeholder="查找不定时上课"
              class="w-full px-5 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-base"
            />
            <button
              id="irregular-search-btn"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-primary text-lg"
            >
              <i class="fa fa-search"></i>
            </button>
            <button
              id="irregular-exit-search-btn"
              class="ml-3 btn btn-outline flex items-center hidden"
              aria-label="退出搜索状态，清空所有查询条件"
              title="退出搜索"
            >
              <i class="fa fa-times mr-1"></i>退出搜索
            </button>
          </div>
        </div>

        <!-- 不定时上课列表 -->
        <div class="card">
          <div class="p-4 border-b border-gray-200">
            <h3 class="text-lg font-semibold text-gray-800">不定时上课列表</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    日期
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    时间
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    姓名
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    课程
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    备注
                  </th>
                  <th
                    class="px-4 py-3 text-left text-sm font-medium text-gray-700"
                  >
                    操作
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200" id="irregular-table-body">
                <!-- 不定时上课数据将通过JavaScript动态添加 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- 添加会员模态框 -->
    <div
      id="add-member-modal"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold text-gray-800">添加会员</h3>
          <button id="close-modal" class="text-gray-500 hover:text-gray-700">
            <i class="fa fa-times text-xl"></i>
          </button>
        </div>
        <form id="add-member-form">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >姓名</label
              >
              <input
                type="text"
                name="name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >卡型</label
              >
              <select
                name="cardType"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              >
                <option value="课时年卡">课时年卡</option>
                <option value="课时季度卡">课时季度卡</option>
                <option value="课时半年卡">课时半年卡</option>
                <option value="年卡">年卡</option>
                <option value="199活动会员">199活动会员</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >年龄</label
              >
              <input
                type="number"
                name="age"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >开卡时间</label
              >
              <input
                type="date"
                name="startDate"
                id="startDate"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >到期日期</label
              >
              <input
                type="date"
                name="endDate"
                id="endDate"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >课时</label
              >
              <input
                type="number"
                name="totalClasses"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >剩余课时</label
              >
              <input
                type="number"
                name="remainingClasses"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >备注</label
              >
              <textarea
                name="remark"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
              ></textarea>
            </div>
          </div>
          <div class="mt-6 flex justify-end space-x-3">
            <button type="button" id="cancel-add" class="btn btn-outline">
              取消
            </button>
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 会员续费模态框 -->
    <div
      id="renew-member-modal"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold text-gray-800">会员续费</h3>
          <button
            id="close-renew-modal"
            class="text-gray-500 hover:text-gray-700"
          >
            <i class="fa fa-times text-xl"></i>
          </button>
        </div>
        <form id="renew-member-form">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >姓名</label
              >
              <input
                type="text"
                name="name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                readonly
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >原到期日期</label
              >
              <input
                type="date"
                name="oldEndDate"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                readonly
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >新到期日期</label
              >
              <input
                type="date"
                name="newEndDate"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >续费课时</label
              >
              <input
                type="number"
                name="addClasses"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >备注</label
              >

    <script>
      const AUTH_TOKEN_KEY = "auth_token";

      // 初始化数据 - 必须在所有函数之前声明
      let members = [];
      let activityMembers = {};
      let activities = [];
      let schedule = [];
      let uncertain = [];
      let irregular = [];
      let classStudents = {};

      // 分页相关变量
      let currentPage = 1;
      const pageSize = 10;

      let saveTimer = null;
      let lastSaveFailedAt = 0;

      function getAuthToken() {
        return localStorage.getItem(AUTH_TOKEN_KEY);
      }

      function goToLogin() {
        try {
          if (window.top && window.top !== window) {
            window.top.location.href = "/login";
          } else {
            window.location.href = "/login";
          }
        } catch {
          window.location.href = "/login";
        }
      }

      function loadData() {
        const token = getAuthToken();
        if (!token) {
          goToLogin();
          return Promise.resolve(getDefaultData());
        }

        return fetch("/api/state", {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        })
          .then(async (response) => {
            if (response.status === 401) {
              goToLogin();
              throw new Error("Unauthorized");
            }
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const json = await response.json();
            return json.state;
          })
          .catch(() => {
            return Promise.resolve(getDefaultData());
          });
      }

      function getDefaultData() {
        return {
          members: [],
          activityMembers: {},
          activities: [],
          schedule: [],
          uncertain: [],
          irregular: [],
          classStudents: {},
        };
      }

      function buildStatePayload() {
        return {
          members,
          activityMembers,
          activities,
          schedule,
          uncertain,
          irregular,
          classStudents,
        };
      }

      function pushStateToServer() {
        const token = getAuthToken();
        if (!token) {
          goToLogin();
          return;
        }
        fetch("/api/state", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(buildStatePayload()),
        })
          .then((r) => {
            if (r.status === 401) {
              goToLogin();
              throw new Error("Unauthorized");
            }
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then((json) => {
            if (json && json.state) {
              members = json.state.members || members;
              activityMembers = json.state.activityMembers || activityMembers;
              activities = json.state.activities || activities;
              schedule = json.state.schedule || schedule;
              uncertain = json.state.uncertain || uncertain;
              irregular = json.state.irregular || irregular;
              classStudents = json.state.classStudents || classStudents;
            }
          })
          .catch(() => {
            const now = Date.now();
            if (now - lastSaveFailedAt > 10000) {
              lastSaveFailedAt = now;
              alert("保存到服务器失败，请检查网络或后端服务是否启动。");
            }
          });
      }

      function saveData() {
        try {
          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            pushStateToServer();
          }, 400);
          return true;
        } catch {
          alert("保存失败，请重试！");
          return false;
        }
      }

      // 设置日期默认值
      function setDefaultDates() {
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        
        // 设置开卡时间默认为今天
        const startDateInput = document.getElementById('startDate');
        if (startDateInput && !startDateInput.value) {
          startDateInput.value = todayStr;
        }
        
        // 设置到期日期默认为一年后
        const nextYear = new Date(today);
        nextYear.setFullYear(today.getFullYear() + 1);
        const nextYearStr = nextYear.toISOString().split('T')[0];
        
        const endDateInput = document.getElementById('endDate');
        if (endDateInput && !endDateInput.value) {
          endDateInput.value = nextYearStr;
        }
      }

      // 加载数据
      function initializeApp() {
        // 先设置日期默认值
        setDefaultDates();
        
        loadData().then((data) => {
          members = data.members;
          activityMembers = data.activityMembers;
          if (Array.isArray(data.activities)) {
            activities = data.activities;
          }
          schedule = data.schedule;
          uncertain = data.uncertain;
          irregular = data.irregular;
          classStudents = data.classStudents;

          // 批量添加数据（只在数据为空时）
          // batch add removed (data loaded from API)

          // 渲染表格
          renderMembersTable();
          renderScheduleTable();
          renderUncertainTable();
          renderIrregularTable();
          renderActivityList();
          updateCardTypeOptions();
          
          // 检查到期提醒
          checkExpiryAlerts();
        });
      }

      // 计算两个日期之间的天数差
      function getDaysDiff(endDateStr) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        // 处理不同格式的日期
        let endDate;
        if (endDateStr.includes("-")) {
          // 处理年月格式如"2025-02"
          if (endDateStr.split("-").length === 2) {
            const parts = endDateStr.split("-");
            endDate = new Date(parts[0], parts[1] - 1, 1);
            // 设置为该月的最后一天
            endDate.setMonth(endDate.getMonth() + 1);
            endDate.setDate(0);
          } else {
            endDate = new Date(endDateStr);
          }
        } else if (endDateStr.includes("/")) {
          const parts = endDateStr.split("/");
          endDate = new Date(parts[2], parts[1] - 1, parts[0]);
        } else if (endDateStr.includes("、")) {
          const parts = endDateStr.split("、");
          endDate = new Date(parts[0], parts[1] - 1, 1);
          // 设置为该月的最后一天
          endDate.setMonth(endDate.getMonth() + 1);
          endDate.setDate(0);
        } else {
          endDate = new Date(endDateStr);
        }

        // 检查日期是否有效
        if (isNaN(endDate.getTime())) {
          return 9999; // 返回一个很大的数字，表示日期无效
        }

        endDate.setHours(0, 0, 0, 0);
        const diffTime = endDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays;
      }

      // 检查到期提醒
      function checkExpiryAlerts() {
        const alertContent = document.getElementById("alert-content");
        alertContent.innerHTML = "";

        // 检查当前是否在活动会员页面
        const pageTitle =
          document.querySelector("#members-page h2").textContent;
        let expiringMembers = [];

        // 提取活动名称
        if (pageTitle.includes("会员列表") && pageTitle !== "会员列表") {
          const activityName = pageTitle.replace("会员列表", "").trim();
          // 只显示当前活动的会员提醒
          if (activityMembers[activityName]) {
            expiringMembers = activityMembers[activityName].filter((member) => {
              const daysDiff = getDaysDiff(member.endDate);
              return daysDiff <= 10;
            });
          }
        } else {
          // 显示普通会员的提醒
          expiringMembers = members.filter((member) => {
            const daysDiff = getDaysDiff(member.endDate);
            return daysDiff <= 10;
          });
        }

        if (expiringMembers.length === 0) {
          alertContent.innerHTML =
            '<p class="text-gray-500 text-sm">暂无到期提醒</p>';
          return;
        }

        expiringMembers.forEach((member) => {
          const daysDiff = getDaysDiff(member.endDate);
          let alertClass, alertText, iconClass;

          if (daysDiff < 0) {
            alertClass = "bg-red-100 border-red-400 text-red-800";
            alertText = `已过期${Math.abs(daysDiff)}天`;
            iconClass = "fa-exclamation-circle text-red-500";
          } else if (daysDiff === 0) {
            alertClass = "bg-red-100 border-red-400 text-red-800";
            alertText = "今天到期";
            iconClass = "fa-exclamation-circle text-red-500";
          } else {
            alertClass = "bg-red-100 border-red-400 text-red-800";
            alertText = `${daysDiff}天后到期`;
            iconClass = "fa-exclamation-circle text-red-500";
          }

          const alertDiv = document.createElement("div");
          alertDiv.className = `${alertClass} p-3 rounded-md border-l-4 flex items-center justify-between animate-slide-in`;
          alertDiv.innerHTML = `
                    <div class="flex items-center">
                        <i class="fa ${iconClass} mr-2"></i>
                        <span><strong>${member.name}</strong> (${member.cardType}) - ${alertText}</span>
                    </div>
                    <span class="text-sm">到期日期: ${member.endDate}</span>
                `;
          alertContent.appendChild(alertDiv);
        });
      }

      // 切换到期提醒的折叠状态
      function toggleExpiryAlerts() {
        const alertContent = document.getElementById("alert-content");
        const toggleIcon = document.getElementById("alert-toggle-icon");

        if (alertContent.style.display === "none") {
          alertContent.style.display = "block";
          toggleIcon.className = "fa fa-chevron-down text-gray-500";
        } else {
          alertContent.style.display = "none";
          toggleIcon.className = "fa fa-chevron-up text-gray-500";
        }
      }

      // 跳转到活动页面
      function goToActivityPage(activityName) {
        // 关闭活动管理模态框
        document
          .getElementById("activity-management-modal")
          .classList.add("hidden");

        // 确保在会员管理页面
        document.getElementById("members-page").classList.remove("hidden");
        document.getElementById("schedule-page").classList.add("hidden");
        document.getElementById("nav-members").classList.remove("btn-outline");
        document.getElementById("nav-members").classList.add("btn-primary");
        document.getElementById("nav-schedule").classList.remove("btn-primary");
        document.getElementById("nav-schedule").classList.add("btn-outline");

        // 确保活动会员数据存在
        if (!activityMembers[activityName]) {
          activityMembers[activityName] = [];
          saveData();
        }

        // 显示该活动的会员
        renderActivityMembersTable(activityName);

        // 显示活动会员标题
        document.querySelector("#members-page h2").textContent =
          `${activityName}会员列表`;

        // 添加活动切换和返回按钮
        const header = document.querySelector(
          "#members-page .flex.justify-between",
        );

      // 搜索排课
      function searchSchedule() {
        const searchTerm = document
          .getElementById("schedule-search-input")
          .value.toLowerCase();
        if (!searchTerm) {
          renderScheduleTable();
          document
            .getElementById("schedule-exit-search-btn")
            .classList.add("hidden");
          return;
        }

        document
          .getElementById("schedule-exit-search-btn")
          .classList.remove("hidden");

        const tableBody = document.getElementById("schedule-table-body");
        tableBody.innerHTML = "";

        schedule.forEach((item, index) => {
          // 检查是否包含搜索词
          const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday",
          ];
          const hasMatch = days.some((day) => {
            const classInfo = item[day];
            return classInfo && classInfo.toLowerCase().includes(searchTerm);
          });

          if (hasMatch) {
            const row = document.createElement("tr");
            row.className = "hover:bg-gray-50 transition-all";

            // 处理每个星期的课程和学生
            const dayCells = days
              .map((day) => {
                const classInfo = item[day];
                if (!classInfo)
                  return '<td class="px-4 py-3 text-sm text-gray-900">-</td>';

                // 提取班级名称（去除时间等其他信息）
                const className = classInfo.replace(/\s+\d+:\d+/, "");
                const students = getStudentsByClass(className);

                // 生成学生列表HTML
                const studentsHtml =
                  students.length > 0
                    ? `<div class="text-xs text-gray-500 mt-1">${students.join("、")}</div>`
                    : "";

                return `<td class="px-4 py-3 text-sm text-gray-900">${classInfo}${studentsHtml}<button class="text-primary hover:text-blue-700 text-xs mt-1 inline-block" onclick="editClassStudents('${className}')">编辑学生</button></td>`;
              })
              .join("");

            row.innerHTML = `
                        <td class="px-4 py-3 text-sm font-medium text-gray-900">${item.time}</td>
                        ${dayCells}
                        <td class="px-4 py-3 text-sm">
                            <button class="text-primary hover:text-blue-700 mr-3" onclick="editSchedule(${index})" title="编辑排课"><i class="fa fa-pencil"></i></button>

                        </td>
                    `;
            tableBody.appendChild(row);
          }
        });
      }

      // 数据清洗函数：将NaN/Infinity/Invalid Date替换为可读字符串
      function cleanData(data) {
        return data.map((item) => {
          const cleanedItem = {};
          for (const key in item) {
            const value = item[key];
            if (value === null || value === undefined) {
              cleanedItem[key] = "";
            } else if (typeof value === "number" && isNaN(value)) {
              cleanedItem[key] = "无数据";
            } else if (typeof value === "number" && !isFinite(value)) {
              cleanedItem[key] = "无数据";
            } else if (value instanceof Date && isNaN(value.getTime())) {
              cleanedItem[key] = "无数据";
            } else {
              cleanedItem[key] = value;
            }
          }
          return cleanedItem;
        });
      }

      // 导入会员数据
      function importMembersFromExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const importedData = XLSX.utils.sheet_to_json(worksheet);

          // 验证数据格式
          if (importedData.length > 0) {
            const keys = Object.keys(importedData[0]);
            const requiredKeys = [
              "name",
              "cardType",
              "startDate",
              "endDate",
              "totalClasses",
              "remainingClasses",
            ];
            const hasRequiredKeys = requiredKeys.every((key) =>
              keys.includes(key),
            );

            if (hasRequiredKeys) {
              // 导入预处理：将undefined/null值替换为空字符串，过滤无效行
              const processedData = importedData
                .map((item) => {
                  const processedItem = {
                    name: item.name || "",
                    cardType: item.cardType || "",
                    age: item.age || "",
                    startDate: item.startDate || "",
                    endDate: item.endDate || "",
                    totalClasses: item.totalClasses || 0,
                    remainingClasses: item.remainingClasses || 0,
                    remark: item.remark || "",
                  };
                  // 处理其他可能存在的字段
                  for (const key in item) {
                    if (!processedItem.hasOwnProperty(key)) {
                      processedItem[key] = item[key] === undefined || item[key] === null ? "" : item[key];
                    }
                  }
                  return processedItem;
                })
                .filter((item) => item.name); // 过滤掉姓名为空的无效行

              members = processedData;
              if (!saveData()) {
                alert("数据保存失败，请检查数据格式！");
              }
              renderMembersTable();
              alert("会员数据导入成功！");
            } else {
              alert("导入的Excel文件格式不正确，请确保包含所有必要字段。");
            }
          }
        };
        reader.readAsArrayBuffer(file);
      }

      // 导入排课数据
      function importScheduleFromExcel(event) {

        if (!file) return;

        // 检查文件后缀是否为xlsx
        if (!file.name.endsWith(".xlsx")) {
          alert("请选择xlsx后缀的Excel文件！");

        const reader = new FileReader();
        reader.onload = function (e) {

          const workbook = XLSX.read(data, { type: "array" });
          let importCount = 0;

          // 遍历所有工作表
          workbook.SheetNames.forEach((sheetName) => {
            const worksheet = workbook.Sheets[sheetName];
            const importedData = XLSX.utils.sheet_to_json(worksheet);

            if (importedData.length > 0) {

                  for (const key in item) {
                    if (item[key] === undefined || item[key] === null) {
                      processedItem[key] = "";

                  }
                  return processedItem;
                });

                importCount++;
              } else if (
                sheetName.includes("不确定") ||
                (keys.includes("date") && keys.includes("course"))
              ) {
                // 导入不确定情况数据
                // 导入预处理：将undefined/null值替换为空字符串，过滤无效行
                const processedUncertain = importedData
                  .map((item) => {
                    const processedItem = {};
                    for (const key in item) {
                      if (item[key] === undefined || item[key] === null) {
                        processedItem[key] = "";
                      } else {
                        processedItem[key] = item[key];
                      }
                    }
                    return processedItem;
                  })
                  .filter((item) => item.date); // 过滤掉日期为空的无效行
                uncertain = processedUncertain;
                if (!saveData()) {
                  alert("数据保存失败，请检查数据格式！");
                }
                renderUncertainTable();
                importCount++;
              } else if (
                sheetName.includes("不定时") ||
                (keys.includes("date") &&
                  keys.includes("time") &&
                  keys.includes("course"))
              ) {
                // 导入不定时上课数据
                // 导入预处理：将undefined/null值替换为空字符串，过滤无效行
                const processedIrregular = importedData
                  .map((item) => {
                    const processedItem = {};
                    for (const key in item) {
                      if (item[key] === undefined || item[key] === null) {
                        processedItem[key] = "";
                      } else {
                        processedItem[key] = item[key];
                      }
                    }
                    return processedItem;
                  })
                  .filter((item) => item.date); // 过滤掉日期为空的无效行
                irregular = processedIrregular;
                if (!saveData()) {
                  alert("数据保存失败，请检查数据格式！");
                }
                renderIrregularTable();
                importCount++;
              }
            }

          if (importCount > 0) {
            alert(`成功导入${importCount}个工作表的数据！`);
          } else {
            alert("未找到有效的数据工作表，请检查Excel文件格式。");
          }
        };
        reader.readAsArrayBuffer(file);
